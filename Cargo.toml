[package]
name = "syrtis-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
snow = { version = "=0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
hmac = { version = "=0.12.1", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
unicode-normalization = { version = "=0.1.25", default-features = false, features = ["std"] }

[dev-dependencies]
x25519-dalek = { version = "=2.0.1", default-features = false }
chacha20poly1305 = { version = "=0.10.1", default-features = false }
blake2 = { version = "=0.10.6", default-features = false }
