[package]
name = "syrtis-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
snow = { version = "=0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
hmac = { version = "=0.12.1", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
unicode-normalization = { version = "=0.1.25", default-features = false, features = ["std"] }
tokscale-core = { git = "https://github.com/Nanako0129/tokscale-core", rev = "2378f31a258b4875349a2d857338e3ed63fa60d8" }

[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.189", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Shell"] }
socket2 = { version = "=0.6.5", default-features = false }

[dev-dependencies]
x25519-dalek = { version = "=2.0.1", default-features = false }
chacha20poly1305 = { version = "=0.10.1", default-features = false }
blake2 = { version = "=0.10.6", default-features = false }
